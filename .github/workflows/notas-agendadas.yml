name: Notas agendadas

# As notas de campo nascem como posts do Instagram, no repositório privado
# autark-instagram. O calendário é privado de propósito: um post só entra aqui,
# no repositório público, no dia em que ele sai. Todo dia de manhã este
# workflow confere o calendário, copia o que venceu, gera a imagem de
# compartilhamento e chama o Publicar, que testa, põe no ar e avisa os
# buscadores.
#
# Leitura do repositório privado: chave de implantação só de leitura, guardada
# no segredo INSTAGRAM_DEPLOY_KEY (a pública está em autark-instagram >
# Settings > Deploy keys). Sem post novo, o workflow termina em segundos.

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília: a nota do dia já está no ar de manhã.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: notas-agendadas
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar as notas do dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ler o calendário (autark-instagram, só os posts)
        uses: actions/checkout@v7
        with:
          repository: ParkNow914/autark-instagram
          ssh-key: ${{ secrets.INSTAGRAM_DEPLOY_KEY }}
          path: .calendario
          sparse-checkout: posts
          persist-credentials: false

      - name: Copiar o que venceu
        id: copiar
        run: |
          set -eu
          hoje=$(TZ=America/Sao_Paulo date +%F)
          : > novas.txt
          for f in .calendario/posts/*.md; do
            nome=$(basename "$f")
            data=${nome:0:10}
            [[ "$data" > "$hoje" ]] && continue
            [ -e "site/content/notas/$nome" ] && continue
            cp "$f" site/content/notas/
            echo "$nome" >> novas.txt
          done
          n=$(wc -l < novas.txt | tr -d ' ')
          echo "novas=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            echo "Nenhuma nota vence hoje ($hoje)." >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "Notas que entram hoje ($hoje):"; sed 's/^/- /' novas.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.copiar.outputs.novas != '0'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Gerar a imagem de compartilhamento
        if: steps.copiar.outputs.novas != '0'
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run og:notas

      - name: Registrar e publicar
        if: steps.copiar.outputs.novas != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/content/notas site/public/notas/og
          titulos=$(for f in $(cat novas.txt); do grep -m1 '^titulo:' "site/content/notas/$f" | sed 's/^titulo: //'; done | paste -sd ';' - | sed 's/;/; /g')
          git commit -m "Nota de campo do dia: ${titulos}"
          git push
          # Push feito com o GITHUB_TOKEN não dispara outro workflow; o
          # workflow_dispatch é a exceção documentada, então o Publicar vem por ele.
          gh workflow run publicar.yml --ref main
