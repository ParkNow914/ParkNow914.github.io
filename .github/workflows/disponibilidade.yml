name: Disponibilidade

# A CI só roda quando alguém empurra código ou na rodada semanal. Nada disso
# percebe o site cair sozinho: certificado que expira, Pages que para de servir,
# domínio cujo DNS alguém mexeu. Este workflow existe para essa lacuna.
#
# Duas vezes por dia é de propósito. De hora em hora encheria a caixa e
# treinaria a ignorar; uma vez por dia deixaria o site fora do ar uma noite
# inteira sem ninguém saber.

on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: disponibilidade
  cancel-in-progress: false

jobs:
  conferir:
    name: O site está no ar?
    runs-on: ubuntu-latest
    steps:
      - name: Responder e conter o que deve conter
        id: teste
        run: |
          set -u
          alvo="https://autarktech.com.br/"
          falhas=""

          codigo=$(curl -s -o corpo.html -w "%{http_code}" -L --max-time 25 "$alvo" || true)
          if [ "$codigo" != "200" ]; then
            falhas="${falhas}- A raiz respondeu HTTP ${codigo} (esperado 200)\n"
          fi

          # HTTP 200 nao prova que a pagina esta certa: o Pages devolve 200 numa
          # pagina de erro dele. Conferir uma frase que so existe no site
          # distingue "no ar" de "respondendo".
          if ! grep -q "Autark" corpo.html 2>/dev/null; then
            falhas="${falhas}- A resposta veio sem a palavra Autark: pode ser pagina de erro do Pages\n"
          fi

          # As landings sao o destino do trafego pago. Se uma cair, a verba
          # continua saindo e ninguem percebe.
          for slug in agenda atendimento juridico delivery; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "${alvo}lp/${slug}/" || true)
            if [ "$c" != "200" ]; then
              falhas="${falhas}- A landing /lp/${slug}/ respondeu HTTP ${c}\n"
            fi
          done

          # As duas demos sao outros repositorios servidos sob o mesmo dominio.
          # Elas sairam do checador de links no PR (dominio proprio nao da pra
          # validar antes do merge), entao a vigilancia delas vive aqui.
          for demo in pdv-lio-demo configurador-camadas; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "${alvo}${demo}/" || true)
            if [ "$c" != "200" ]; then
              falhas="${falhas}- A demo /${demo}/ respondeu HTTP ${c}\n"
            fi
          done

          # Certificado prestes a vencer e a falha que da aviso antes de doer.
          fim=$(echo | openssl s_client -servername autarktech.com.br \
                -connect autarktech.com.br:443 2>/dev/null \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
          if [ -n "$fim" ]; then
            dias=$(( ( $(date -d "$fim" +%s) - $(date +%s) ) / 86400 ))
            echo "certificado vence em ${dias} dias (${fim})"
            if [ "$dias" -lt 10 ]; then
              falhas="${falhas}- O certificado TLS vence em ${dias} dias\n"
            fi
          fi

          if [ -n "$falhas" ]; then
            printf "%b" "$falhas" > falhas.txt
            echo "ok=nao" >> "$GITHUB_OUTPUT"
            printf "%b" "$falhas"
            exit 1
          fi
          echo "ok=sim" >> "$GITHUB_OUTPUT"
          echo "Site no ar, 4 landings respondendo." >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir issue se caiu
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="Site fora do ar ou degradado"

          # Uma issue por vez: reabrir a mesma a cada 12h viraria ruido, e ruido
          # e o que faz alguem parar de olhar.
          existe=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$titulo in:title" --json number --jq 'length')

          if [ "$existe" = "0" ]; then
            {
              echo "A verificação automática de $(date -u +'%F %H:%M') UTC encontrou:"
              echo
              cat falhas.txt 2>/dev/null || echo "- (sem detalhe registrado)"
              echo
              echo "[Ver a execução]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            } > corpo.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body-file corpo.md
          fi
