name: Qualidade

# O site é estático e sem build, então a CI aqui não compila nada: ela só impede
# que uma regressão silenciosa chegue à produção — link morto, imagem faltando,
# HTML inválido ou queda de performance/acessibilidade.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Links externos apodrecem sozinhos (demo fora do ar, repo renomeado).
    # Segunda-feira, 09:00 UTC.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML + referências locais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar HTML
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .
          blacklist: assets
          css: true
          # O validador do W3C ainda nao conhece size-adjust (fallback de fonte,
          # CSS Fonts 5) nem ::view-transition (View Transitions API). Sao validos
          # nos navegadores; ignoramos so essas duas mensagens.
          extra: --ignore-re "size-adjust|view-transition" 

      - name: Conferir que todo arquivo referenciado existe
        run: python3 tools/check-assets.py

  links:
    name: Links externos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir: sem ele o lychee não resolve os links root-relative
          # ("/assets/...") em arquivos locais e reporta cada um como erro.
          # As referências locais já são validadas por tools/check-assets.py;
          # aqui o que interessa são os links externos.
          # wa.me e o 99freelas bloqueiam requisições automatizadas e dariam
          # falso positivo; o resto (demos, GitHub, OG) é checado de verdade.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --max-retries 3
            --timeout 25
            --accept 200,206,301,302,308,403,429
            --exclude "^https://wa\.me"
            --exclude "^https://www\.99freelas\.com\.br"
            --exclude-path assets
            index.html 404.html README.md lp/agenda/index.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse (${{ matrix.perfil }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - perfil: desktop
            config: lighthouserc.json
          - perfil: mobile
            config: lighthouserc.mobile.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rodar Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=${{ matrix.config }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    name: Fluxos críticos (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Rodar testes
        run: node tools/e2e.mjs
