<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Autark — sistemas que trabalham sozinhos enquanto você cresce">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset=".55" stop-color="#081326"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="230" cy="60" rx="420" ry="260" fill="url(#glow)"/>
    <ellipse cx="1010" cy="300" rx="360" ry="220" fill="url(#glow)" opacity=".7"/>
    <rect width="1200" height="320" fill="url(#sheen)"/>

    <!-- marca: "A" de linha continua com seta (piloto automatico) -->
    <g transform="translate(92 92) scale(0.42)" fill="none" stroke="url(#brand)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92 250 C58 250 44 214 62 190 L160 52 Q180 24 200 52 L298 190 C316 214 302 250 268 250">
        <animate attributeName="stroke-dasharray" from="0 900" to="900 0" dur="1.6s" fill="freeze"/>
      </path>
      <path d="M232 226 C196 226 180 202 182 174 L190 120">
        <animate attributeName="stroke-dasharray" from="0 300" to="300 0" dur="1.2s" begin="0.5s" fill="freeze"/>
      </path>
      <path d="M158 132 L192 96 L226 132">
        <animate attributeName="stroke-dasharray" from="0 200" to="200 0" dur=".8s" begin="1.1s" fill="freeze"/>
      </path>
    </g>

    <!-- wordmark -->
    <text x="248" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#eef3fa" letter-spacing="-2">Autark</text>
    <text x="252" y="196" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="21" fill="#34d399" letter-spacing="1.5">automação com IA · bots de WhatsApp · SaaS</text>
    <text x="252" y="238" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#8b96a9">Sistemas que trabalham sozinhos enquanto você cresce.</text>

    <!-- indicadores (ancorados a direita para nunca colidir com o texto) -->
    <g font-family="ui-monospace, Consolas, monospace">
      <g transform="translate(1140 104)" text-anchor="end">
        <rect x="-272" y="-25" width="272" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
        <circle cx="-250" cy="-3" r="5" fill="#25d366">
          <animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="-18" y="2" font-size="15" fill="#cfd8e6">disponível para projetos</text>
      </g>
      <g transform="translate(1140 196)" text-anchor="end">
        <text x="-150" y="0" font-size="34" font-weight="700" fill="#eef3fa">5.0</text>
        <text x="-118" y="-2" font-size="22" fill="#fbbf24">★</text>
        <text x="0" y="0" font-size="16" fill="#8b96a9">no 99freelas</text>
      </g>
      <text x="1140" y="230" text-anchor="end" font-size="13.5" fill="#8b96a9">3 projetos entregues · 100% recomendam</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
