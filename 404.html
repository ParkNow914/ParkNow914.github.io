  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center;

      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      font-size: clamp(3.5rem, 12vw, 7rem); line-height: 1; margin: 12px 0 8px;
      background: linear-gradient(100deg, #34d399, #22d3ee);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { color: #8b96a9; margin-bottom: 32px; font-size: 1.05rem; }
    a.btn {
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      font-family: "Space Grotesk", sans-serif; font-weight: 600;
      background: linear-gradient(120deg, #25d366, #34d399); color: #03140b;
      padding: 15px 28px; border-radius: 14px; box-shadow: 0 8px 30px rgba(37,211,102,0.25);
      transition: transform 0.2s;
    }
    a.btn:hover { transform: translateY(-3px); }
